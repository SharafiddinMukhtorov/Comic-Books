<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoRing" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#67b3f0"/>
      <stop offset="30%"  stop-color="#3b82f6"/>
      <stop offset="65%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="logoHi" cx="0.4" cy="0.25" r="0.55">
      <stop offset="0%"   stop-color="#dbeafe" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoM" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Outer thick ring -->
  <circle cx="50" cy="50" r="48" fill="url(#logoRing)"/>
  <!-- Inner cutout (white) -->
  <circle cx="50" cy="50" r="36" fill="#ffffff"/>
  <!-- Highlight on top -->
  <circle cx="50" cy="50" r="48" fill="url(#logoHi)"/>

  <!-- M shape -->
  <path d="M 24 76
           C 24 50, 32 30, 40 30
           C 47 30, 50 42, 50 52
           C 50 42, 53 30, 60 30
           C 68 30, 76 50, 76 76
           L 66 76
           C 66 56, 62 42, 57 42
           C 53 42, 52 54, 52 68
           L 48 68
           C 48 54, 47 42, 43 42
           C 38 42, 34 56, 34 76
           Z"
        fill="url(#logoM)"
        stroke="#1e3a8a"
        stroke-width="0.6"/>
</svg>
